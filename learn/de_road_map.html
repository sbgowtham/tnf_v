<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Engineering Roadmap</title>
<meta name="description" content="An interactive, zoomable mind map of the Data Engineering roadmap — Linux, SQL, Python, Big Data, Cloud, Airflow, and AI tools in one visual guide.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d1117;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}
#svg {
  width: 100%;
  height: 100%;
  cursor: grab;
  display: block;
}
#svg:active { cursor: grabbing; }
#topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
  background: linear-gradient(#0d1117 60%, transparent);
  z-index: 9;
}
#topbar h1 { font-size: 1rem; font-weight: 700; color: #fff; letter-spacing: .04em; }
#topbar p  { font-size: .62rem; color: #3a4a6a; font-weight: 400; }
#watermark {
  position: absolute;
  bottom: 16px;
  right: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  pointer-events: all;
  z-index: 9;
}
#watermark span {
  font-size: .82rem;
  font-weight: 700;
  color: rgba(255,255,255,0.75);
  letter-spacing: .04em;
}
#watermark a {
  font-size: .7rem;
  font-weight: 500;
  color: rgba(100,180,255,0.7);
  text-decoration: none;
  letter-spacing: .02em;
  transition: color .2s;
}
#watermark a:hover { color: rgba(100,180,255,1); }
</style>
</head>
<body>

<div id="topbar">
  <div style="display:flex;align-items:center;gap:16px;">
    <h1>⚡ Data Engineering Roadmap</h1>
    <div style="display:flex;flex-direction:column;gap:1px;border-left:1px solid rgba(255,255,255,0.15);padding-left:16px;">
      <span style="font-size:.78rem;font-weight:700;color:rgba(255,255,255,0.85);letter-spacing:.03em;">Gowtham SB</span>
      <a href="https://linkedin.com/in/sbgowtham" target="_blank" style="font-size:.62rem;font-weight:500;color:rgba(100,180,255,0.8);text-decoration:none;pointer-events:all;">linkedin.com/in/sbgowtham</a>
    </div>
  </div>
  <p>Click nodes to expand / collapse &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Drag to pan</p>
</div>

<svg id="svg"><g id="g"></g></svg>

<div id="watermark">
  <span>Gowtham SB</span>
  <a href="https://linkedin.com/in/sbgowtham" target="_blank">linkedin.com/in/sbgowtham</a>
</div>

<script>
var COLOR = {
  'Linux':                 '#FF6B35',
  'SQL':                   '#4ECDC4',
  'Python':                '#F5C518',
  'Big Data':              '#52C87A',
  'Cloud':                 '#818CF8',
  'Airflow':               '#38BDF8',
  'AI for Data Engineers': '#C084FC'
};
var ROOT_COLOR = '#4A7FB5';

var DATA = {
  name: 'Data Engineering',
  kids: [
    { name: 'Linux', kids: [
        { name: 'File Handling', kids: [
          'ls','cd','pwd','mkdir','rmdir','rm','cp','mv','touch','cat',
          'more','less','head','tail','find','locate','which','whereis','ln',
          'chmod','chown','chgrp','umask','wc','diff','patch','tar','gzip',
          'zip','unzip','rsync','scp','sftp','dd','stat','file','sort',
          'cut','grep','awk','sed','tr','tee','xargs','uniq','paste',
          'split','basename','dirname','readlink'
        ].map(function(n){ return {name:n}; }) },
        { name: 'Process Handling', kids: [
          'ps','top','htop','kill','killall','pkill','nice','renice',
          'bg','fg','jobs','nohup','screen','tmux','systemctl','service',
          'cron','crontab','at','pgrep','strace','lsof','ulimit',
          'free','vmstat','iostat','uptime','watch'
        ].map(function(n){ return {name:n}; }) }
    ]},
    { name: 'SQL', kids: [
      'SELECT','INSERT','DELETE','UPDATE','Aggregations','Joins',
      'Window Functions','Subqueries','CTEs','Indexing','Constraints','Transactions'
    ].map(function(n){ return {name:n}; }) },
    { name: 'Python', kids: [
      'OOP','Functional Programming','Exception Handling','File Handling',
      'Map / Set / List','Stack / Queue','JDBC Connectivity',
      'Variables','Data Types','DataFrames'
    ].map(function(n){ return {name:n}; }) },
    { name: 'Big Data', kids: [
      { name: 'Hadoop', kids: [{name:'HDFS'},{name:'Hive'},{name:'Sqoop'}] },
      { name: 'Spark',  kids: [{name:'RDD'},{name:'DataFrames'},{name:'Spark SQL'},{name:'Spark Streaming'}] }
    ]},
    { name: 'Cloud', kids: [
      { name: 'AWS',   kids: [{name:'EMR'},{name:'Athena'}] },
      { name: 'GCP',   kids: [{name:'Dataproc'},{name:'BigQuery'}] },
      { name: 'Azure', kids: [{name:'Synapse'},{name:'HDInsight'}] }
    ]},
    { name: 'Airflow' },
    { name: 'AI for Data Engineers', kids: [
      {name:'MCP'},{name:'RAG'},{name:'Open Source Models'}
    ]}
  ]
};

function nodeW(d) { return [200,155,128,82][d < 4 ? d : 3]; }
function nodeH(d) { return [38, 32, 27, 22][d < 4 ? d : 3]; }
var HG = 52;
var VG = 9;

function initNode(node, depth, parentColor) {
  node.depth = depth;
  node.color = COLOR[node.name] || parentColor || ROOT_COLOR;
  node.open  = (depth < 2);
  if (node.kids) {
    for (var i = 0; i < node.kids.length; i++) {
      initNode(node.kids[i], depth + 1, node.color);
    }
  }
}
initNode(DATA, 0, ROOT_COLOR);

function subtreeH(node) {
  if (!node.open || !node.kids || !node.kids.length) {
    return nodeH(node.depth) + VG;
  }
  var total = 0;
  for (var i = 0; i < node.kids.length; i++) {
    total += subtreeH(node.kids[i]);
  }
  return total;
}

function placeNodes(node, x, yTop) {
  node.x  = x;
  node.cy = yTop + subtreeH(node) / 2;
  if (node.open && node.kids && node.kids.length) {
    var y = yTop;
    for (var i = 0; i < node.kids.length; i++) {
      var kid = node.kids[i];
      placeNodes(kid, x + nodeW(node.depth) + HG, y);
      y += subtreeH(kid);
    }
  }
}

var NS = 'http://www.w3.org/2000/svg';
var gEl = document.getElementById('g');

function svgEl(tag, attrs) {
  var e = document.createElementNS(NS, tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  return e;
}

function toRgba(hex, a) {
  var r = parseInt(hex.slice(1,3), 16);
  var gv = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);
  return 'rgba(' + r + ',' + gv + ',' + b + ',' + a + ')';
}

function collectVisible(node, arr) {
  arr.push(node);
  if (node.open && node.kids) {
    for (var i = 0; i < node.kids.length; i++) {
      collectVisible(node.kids[i], arr);
    }
  }
}

function render() {
  while (gEl.firstChild) { gEl.removeChild(gEl.firstChild); }

  placeNodes(DATA, 0, 0);

  var visible = [];
  collectVisible(DATA, visible);

  // Draw links
  for (var i = 0; i < visible.length; i++) {
    var node = visible[i];
    if (!node.open || !node.kids) continue;
    for (var j = 0; j < node.kids.length; j++) {
      var child = node.kids[j];
      var x1 = node.x + nodeW(node.depth);
      var y1 = node.cy;
      var x2 = child.x;
      var y2 = child.cy;
      var mx = (x1 + x2) / 2;
      gEl.appendChild(svgEl('path', {
        d: 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2,
        fill: 'none',
        stroke: node.color + '55',
        'stroke-width': 1.5
      }));
    }
  }

  // Draw nodes
  for (var i = 0; i < visible.length; i++) {
    (function(node) {
      var d  = node.depth;
      var w  = nodeW(d);
      var h  = nodeH(d);
      var nx = node.x;
      var ny = node.cy - h / 2;
      var hasKids = !!(node.kids && node.kids.length);

      var grp = svgEl('g', { transform: 'translate(' + nx + ',' + ny + ')' });
      if (hasKids) grp.style.cursor = 'pointer';

      var fillA = [0.18, 0.13, 0.09, 0.06][d < 4 ? d : 3];
      grp.appendChild(svgEl('rect', {
        x: 0, y: 0, width: w, height: h, rx: 7, ry: 7,
        fill:   toRgba(node.color, fillA),
        stroke: node.color,
        'stroke-width': d <= 1 ? 1.5 : 1
      }));

      var fs  = [13, 12, 11, 9.5][d < 4 ? d : 3];
      var fw  = d <= 1 ? 600 : 400;
      var fc  = d === 0 ? '#ffffff' : d === 1 ? node.color : '#c5d5e5';
      var labelX = hasKids ? (w / 2 - 5) : (w / 2);

      var txt = svgEl('text', {
        x: labelX, y: h / 2,
        'text-anchor': 'middle',
        'dominant-baseline': 'middle',
        'font-family': 'Poppins, sans-serif',
        'font-size': fs,
        'font-weight': fw,
        fill: fc,
        'pointer-events': 'none'
      });
      txt.textContent = node.name;
      grp.appendChild(txt);

      if (hasKids) {
        var arr = svgEl('text', {
          x: w - 10, y: h / 2,
          'text-anchor': 'middle',
          'dominant-baseline': 'middle',
          'font-size': 9,
          fill: node.color + 'cc',
          'pointer-events': 'none'
        });
        arr.textContent = node.open ? '▾' : '▸';
        grp.appendChild(arr);

        grp.addEventListener('click', function(e) {
          e.stopPropagation();
          node.open = !node.open;
          render();
          applyT();
        });
      }

      gEl.appendChild(grp);
    })(visible[i]);
  }
}

// Pan & Zoom
var svgEl2 = document.getElementById('svg');
var tx = 40, ty = 60, sc = 1;
var dragging = false, ox = 0, oy = 0;

function applyT() {
  gEl.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + sc + ')');
}

function getRightmost(node) {
  var mx = node.x + nodeW(node.depth);
  if (node.open && node.kids) {
    for (var i = 0; i < node.kids.length; i++) {
      var r = getRightmost(node.kids[i]);
      if (r > mx) mx = r;
    }
  }
  return mx;
}

function autoFit() {
  var treeH = subtreeH(DATA);
  var treeW = getRightmost(DATA) + 80;
  var svgW  = window.innerWidth;
  var svgH  = window.innerHeight - 60;
  sc = Math.min(1.0, (svgH * 0.9) / treeH, (svgW * 0.92) / treeW);
  tx = 40;
  ty = Math.max(50, (window.innerHeight - treeH * sc) / 2);
  applyT();
}

svgEl2.addEventListener('mousedown', function(e) {
  dragging = true;
  ox = e.clientX - tx;
  oy = e.clientY - ty;
});
window.addEventListener('mouseup', function() { dragging = false; });
window.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  tx = e.clientX - ox;
  ty = e.clientY - oy;
  applyT();
});
svgEl2.addEventListener('wheel', function(e) {
  e.preventDefault();
  var factor = e.deltaY < 0 ? 1.12 : 0.89;
  var newSc  = Math.max(0.1, Math.min(4, sc * factor));
  var rect   = svgEl2.getBoundingClientRect();
  var mx     = e.clientX - rect.left;
  var my     = e.clientY - rect.top;
  tx = mx - (mx - tx) * (newSc / sc);
  ty = my - (my - ty) * (newSc / sc);
  sc = newSc;
  applyT();
}, { passive: false });

render();
autoFit();
</script>
</body>
</html>
