<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TableNotFound — Learn SQL Through Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surf:#181818;--surf2:#222;--bdr:#2c2c2c;
  --txt:#e8e8e8;--muted:#888;--faint:#444;
  --acc:#f97316;--acc-bg:#1c1007;--acc-mute:#7c3a0a;
  --ok:#4ade80;--err:#f87171;--blue:#60a5fa;--pink:#f472b6;
  --font:'Sora',sans-serif;--mono:'Space Mono',monospace;
  --r:8px;--r2:12px;
}
body{background:var(--bg);color:var(--txt);font-family:var(--font);min-height:100vh;font-size:14px;line-height:1.6}
/* Layout */
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:260px;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.main{flex:1;overflow-y:auto;padding:1.75rem 2rem}
/* Sidebar */
.sb-logo{padding:1.1rem 1.25rem .9rem;border-bottom:1px solid var(--bdr)}
.sb-logo .name{font-size:16px;font-weight:700}.sb-logo .name span{color:var(--acc)}
.sb-logo .tag{font-size:11px;color:var(--muted);margin-top:2px}
.sb-langs{display:flex;gap:4px;padding:.625rem 1rem;border-bottom:1px solid var(--bdr)}
.ltab{flex:1;padding:4px 0;border:1px solid var(--bdr);background:transparent;color:var(--muted);border-radius:var(--r);cursor:pointer;font-size:10px;font-family:var(--font);font-weight:600;transition:all .15s}
.ltab:hover{color:var(--txt)}.ltab.on{background:var(--acc-bg);border-color:var(--acc-mute);color:var(--acc)}
.sb-sec{font-size:10px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;padding:.625rem 1.25rem .3rem;font-weight:500}
.utab{display:flex;align-items:center;gap:8px;padding:.45rem 1rem;cursor:pointer;transition:background .12s;border:none;background:transparent;width:100%;text-align:left}
.utab:hover{background:var(--surf2)}.utab.on{background:var(--surf2)}
.u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.uname{font-size:12px;color:var(--muted);font-family:var(--font)}.utab.on .uname{color:var(--txt)}
.sb-qlist{flex:1;overflow-y:auto;border-top:1px solid var(--bdr);padding:.5rem}
.qitem{display:flex;align-items:center;gap:8px;padding:.45rem .75rem;border-radius:var(--r);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background .12s}
.qitem:hover{background:var(--surf2)}.qitem.on{background:var(--surf2);border-left:2px solid var(--acc)}
.qnum{font-size:10px;color:var(--faint);font-family:var(--mono);min-width:20px}
.qtitle-sb{font-size:11px;color:var(--muted);text-align:left;flex:1}.qitem.on .qtitle-sb{color:var(--txt)}
.diff{font-size:9px;padding:1px 6px;border-radius:4px;flex-shrink:0}
.diff.b{background:#082515;color:#4ade80}.diff.i{background:#0c1a2e;color:#60a5fa}.diff.a{background:#1c0d2e;color:#c084fc}
/* DB status */
.db-status{padding:.4rem 1rem;font-size:10px;color:var(--muted);border-top:1px solid var(--bdr);display:flex;align-items:center;gap:6px}
.db-dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.db-dot.ready{background:var(--ok)}.db-dot.loading{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Main content */
.q-hdr{margin-bottom:1.25rem}
.ubadge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;margin-bottom:.75rem;font-weight:500}
.concepts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:.75rem}
.ctag{background:var(--surf2);color:var(--muted);font-size:10px;padding:2px 8px;border-radius:4px;font-family:var(--mono)}
.story-card{border-radius:var(--r2);padding:.875rem 1.125rem;margin-bottom:1.125rem;border-left:3px solid var(--acc)}
.card-lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:.35rem}
.story-txt{font-size:13px;line-height:1.8;color:var(--txt)}
.q-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:.875rem 1.125rem;margin-bottom:1.125rem}
.q-txt{font-size:14px;font-weight:500;color:var(--txt);line-height:1.5}
/* Schema */
.schema-wrap{margin-bottom:1.25rem}
.schema-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.625rem}
.stbl{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2)}
.stbl-head{padding:.5rem .875rem;border-bottom:1px solid var(--bdr);font-size:11px;font-weight:700;color:var(--acc);font-family:var(--mono)}
.stbl-body{padding:.375rem}
.stbl-row{display:flex;align-items:center;justify-content:space-between;padding:2px .5rem;gap:6px}
.col-n{font-size:11px;font-family:var(--mono);color:var(--txt)}
.col-t{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surf2);color:var(--muted);font-family:var(--mono)}
.col-e{font-size:10px;color:var(--faint);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
/* Steps */
.steps-hdr{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.625rem}
.prog{display:flex;gap:4px;margin-bottom:.875rem}
.pseg{height:3px;flex:1;border-radius:2px;background:var(--bdr);transition:background .3s}
.pseg.done{background:var(--acc)}
.step-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);margin-bottom:.5rem;overflow:hidden}
.step-card.active{border-color:var(--acc-mute)}
.step-hdr{display:flex;align-items:center;gap:10px;padding:.75rem 1.125rem;cursor:pointer;user-select:none}
.step-n{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;border:1px solid var(--bdr);color:var(--muted)}
.step-card.done .step-n{background:var(--acc);color:#000;border-color:var(--acc)}
.step-ttl{font-size:12px;font-weight:500;color:var(--muted);flex:1}.step-card.done .step-ttl,.step-card.open .step-ttl{color:var(--txt)}
.toggle-ico{font-size:10px;color:var(--faint);transition:transform .2s}.open .toggle-ico{transform:rotate(180deg)}
.step-body{display:none;padding:0 1.125rem 1.125rem}
.step-body.open{display:block}
/* SQL Editor */
.sql-lbl{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.4rem}
.sql-editor{width:100%;background:#0a0a0a;border:1px solid var(--bdr);border-radius:var(--r);padding:.75rem 1rem;font-family:var(--mono);font-size:12px;line-height:1.8;color:#ccc;resize:vertical;min-height:80px;outline:none;transition:border-color .15s}
.sql-editor:focus{border-color:var(--acc-mute)}
.editor-actions{display:flex;align-items:center;gap:8px;margin-top:.5rem;margin-bottom:.75rem}
.run-btn{padding:6px 16px;border-radius:var(--r);background:var(--acc);color:#000;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:var(--font);transition:opacity .15s;display:flex;align-items:center;gap:6px}
.run-btn:hover{opacity:.85}.run-btn:disabled{opacity:.4;cursor:not-allowed}
.reset-btn{padding:5px 10px;border-radius:var(--r);background:transparent;color:var(--muted);border:1px solid var(--bdr);cursor:pointer;font-size:11px;font-family:var(--font)}
.reset-btn:hover{color:var(--txt);border-color:var(--faint)}
.row-count{font-size:11px;color:var(--faint);margin-left:auto}
/* Results */
.result-wrap{margin-bottom:.75rem}
.result-lbl{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.4rem}
.tbl-scroll{overflow-x:auto;border:1px solid var(--bdr);border-radius:var(--r)}
.rtbl{width:100%;border-collapse:collapse;font-size:12px}
.rtbl th{text-align:left;padding:6px 10px;background:var(--surf2);color:var(--muted);font-weight:500;border-bottom:1px solid var(--bdr);white-space:nowrap;font-family:var(--mono);font-size:11px}
.rtbl td{padding:6px 10px;border-bottom:1px solid var(--bdr);color:var(--txt);white-space:nowrap;font-family:var(--mono);font-size:12px}
.rtbl tr:last-child td{border-bottom:none}
.err-box{background:#1c0808;border:1px solid #5a1a1a;border-radius:var(--r);padding:.625rem .875rem;font-size:12px;color:var(--err);font-family:var(--mono);line-height:1.6;margin-bottom:.75rem}
/* Explain */
.explain-box{background:var(--acc-bg);border-left:2px solid var(--acc);border-radius:0 var(--r) var(--r) 0;padding:.75rem 1rem;font-size:13px;color:var(--txt);line-height:1.8;display:none}
.explain-box.show{display:block}
/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:65vh;gap:.5rem;text-align:center}
.empty-ico{font-size:40px;margin-bottom:.5rem}
.empty-ttl{font-size:18px;font-weight:600;color:var(--txt)}
.empty-sub{font-size:13px;color:var(--muted)}
/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
@media(max-width:720px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;max-height:45vh}
  .main{padding:1rem}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="name">Table<span>NotFound</span></div>
      <div class="tag">Learn SQL through real stories</div>
    </div>
    <div class="sb-langs">
      <button class="ltab on" onclick="setLang('en')">EN</button>
      <button class="ltab" onclick="setLang('ta')">TA</button>
      <button class="ltab" onclick="setLang('hi')">HI</button>
      <button class="ltab" onclick="setLang('te')">TE</button>
    </div>
    <div class="sb-sec">Universes</div>
    <div id="universe-list"></div>
    <div class="sb-qlist" id="q-list"></div>
    <div class="db-status">
      <div class="db-dot" id="db-dot"></div>
      <span id="db-label">Initialising…</span>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="empty">
      <div class="empty-ico">⚡</div>
      <div class="empty-ttl">Pick a universe to begin</div>
      <div class="empty-sub">Choose a story world from the sidebar, then run real SQL queries in your browser</div>
    </div>
  </main>
</div>

<script>
// ─── CONFIG ─────────────────────────────────────────────────────
const UNIVERSES = [
  {id:'zipeats',  color:'#f97316', label:'ZipEats',     sub:'Food Delivery'},
  {id:'ridego',   color:'#60a5fa', label:'RideGo',      sub:'Ride Hailing'},
  {id:'spark',    color:'#f472b6', label:'Spark',        sub:'Dating App'},
  {id:'connectbook',color:'#818cf8',label:'ConnectBook', sub:'Social Network'},
  {id:'routeiq',  color:'#34d399', label:'RouteIQ',      sub:'Maps & Navigation'},
];
const LANG_LABELS = {en:'English',ta:'Tanglish',hi:'Hinglish',te:'Tenglish'};
const DIFF = {b:'Beginner',i:'Intermediate',a:'Advanced'};
const DIFF_CLS = {b:'b',i:'i',a:'a'};

// ─── STATE ───────────────────────────────────────────────────────
let SQL = null, db = null;
let curLang = 'en';
let curUniverse = null;
let curQ = null;
let uData = {}; // cached universe data
let stepSql = {}; // {qid_si: current sql in textarea}
let stepRan = {}; // {qid_si: bool}
let stepOpen = {}; // {qid_si: bool}

// ─── SQL.JS INIT ─────────────────────────────────────────────────
async function initSqlJs() {
  setDbStatus('loading','Loading SQL engine…');
  try {
    SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
    });
    setDbStatus('ready','SQL engine ready');
  } catch(e) {
    setDbStatus('err','Engine failed: '+e.message);
  }
}

function setDbStatus(s, msg) {
  const dot = document.getElementById('db-dot');
  const lbl = document.getElementById('db-label');
  dot.className = 'db-dot' + (s==='ready'?' ready':s==='loading'?' loading':'');
  lbl.textContent = msg;
}

function createDb(setupSql) {
  if (!SQL) return false;
  try {
    if (db) { db.close(); db = null; }
    db = new SQL.Database();
    const stmts = setupSql
  .split(';')
  .map(s => s.trim())
  .filter(s => s && s !== "");
    stmts.forEach(s => db.run(s+';'));
    return true;
  } catch(e) {
    setDbStatus('err','DB error: '+e.message);
    return false;
  }
}

function runQuery(sql) {
  if (!db) return {error:'Database not ready. Please select a universe first.'};
  try {
    const res = db.exec(sql);
    if (!res || res.length === 0) return {cols:[], rows:[], message:'Query ran successfully. No rows returned.'};
    return {cols: res[0].columns, rows: res[0].values};
  } catch(e) {
    return {error: e.message};
  }
}

// ─── UNIVERSE LOADING ────────────────────────────────────────────
async function loadUniverse(uid) {
  if (uData[uid]) return uData[uid];
  setDbStatus('loading','Loading '+uid+'…');
  try {
    const r = await fetch(`/questions/${uid}.json`);
    const data = await r.json();
    uData[uid] = data;
    return data;
  } catch(e) {
    setDbStatus('err','Load failed: '+e.message);
    return null;
  }
}

async function setUniverse(uid) {
  curUniverse = uid;
  const data = await loadUniverse(uid);
  if (!data) return;
  if (!createDb(data.setup_sql)) return;
  setDbStatus('ready', data.label || uid + ' loaded');
  curQ = data.questions[0];
  renderSidebar();
  renderQuestion();
}

function setQuestion(uid, qid) {
  const data = uData[uid];
  if (!data) return;
  curQ = data.questions.find(q => q.id === qid);
  renderSidebar();
  renderQuestion();
}

// ─── LANG ────────────────────────────────────────────────────────
function setLang(l) {
  curLang = l;
  document.querySelectorAll('.ltab').forEach(t => {
    t.classList.toggle('on', t.textContent.toLowerCase() === (l==='en'?'en':l==='ta'?'ta':l==='hi'?'hi':'te'));
  });
  if (curQ) renderQuestion();
}

function tx(obj) {
  if (typeof obj === 'string') return obj;
  return obj[curLang] || obj['en'] || '';
}

// ─── SIDEBAR RENDER ──────────────────────────────────────────────
function renderSidebar() {
  const ul = document.getElementById('universe-list');
  ul.innerHTML = UNIVERSES.map(u => `
    <button class="utab ${curUniverse===u.id?'on':''}" onclick="setUniverse('${u.id}')">
      <div class="u-dot" style="background:${u.color}"></div>
      <span class="uname">${u.label}</span>
    </button>
  `).join('');

  const ql = document.getElementById('q-list');
  if (!curUniverse || !uData[curUniverse]) { ql.innerHTML=''; return; }
  const qs = uData[curUniverse].questions;
  ql.innerHTML = qs.map(q => `
    <button class="qitem ${curQ&&curQ.id===q.id?'on':''}" onclick="setQuestion('${curUniverse}',${q.id})">
      <span class="qnum">Q${q.id}</span>
      <span class="qtitle-sb">${q.concepts.slice(0,2).join(' · ')}</span>
      <span class="diff ${DIFF_CLS[q.difficulty]}">${DIFF[q.difficulty]}</span>
    </button>
  `).join('');
}

// ─── QUESTION RENDER ─────────────────────────────────────────────
function renderQuestion() {
  const q = curQ;
  if (!q) return;
  const uni = UNIVERSES.find(u => u.id === q.universe || u.id === curUniverse);
  const color = uni ? uni.color : '#f97316';
  const uLabel = uni ? uni.label : '';
  const uSub = uni ? uni.sub : '';

  let html = `
    <div class="q-hdr">
      <div>
        <span class="ubadge" style="background:${color}18;color:${color};border:1px solid ${color}40">
          ${uLabel} &middot; ${uSub}
        </span>
      </div>
      <div class="concepts">
        ${q.concepts.map(c=>`<span class="ctag">${c}</span>`).join('')}
        <span class="diff ${DIFF_CLS[q.difficulty]}">${DIFF[q.difficulty]}</span>
      </div>
    </div>

    <div class="story-card" style="background:${color}0d">
      <div class="card-lbl" style="color:${color}">Your Story</div>
      <div class="story-txt">${tx(q.story)}</div>
    </div>

    <div class="q-card">
      <div class="card-lbl" style="color:var(--muted)">Question</div>
      <div class="q-txt">${tx(q.question)}</div>
    </div>
  `;

  // Schemas
  if (q.schemas && q.schemas.length > 0) {
    html += `<div class="schema-wrap"><div class="schema-grid">`;
    q.schemas.forEach(s => {
      html += `<div class="stbl"><div class="stbl-head">${s.name}</div><div class="stbl-body">`;
      s.cols.forEach(c => {
        html += `<div class="stbl-row"><span class="col-n">${c.n}</span><span class="col-t">${c.t}</span><span class="col-e">${c.e}</span></div>`;
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  }

  // Progress
  html += `<div class="steps-hdr">Step-by-step solution</div>`;
  html += `<div class="prog">`;
  q.steps.forEach((_,i) => {
    const done = stepRan[`${q.id}_${i}`];
    html += `<div class="pseg${done?' done':''}"></div>`;
  });
  html += `</div>`;

  // Steps
  q.steps.forEach((step, si) => {
    const key = `${q.id}_${si}`;
    const isOpen = !!stepOpen[key];
    const isDone = !!stepRan[key];
    const currentSql = stepSql[key] !== undefined ? stepSql[key] : step.sql;

    html += `
      <div class="step-card${isDone?' done':''}${isOpen?' open':''}" id="sc_${key}">
        <div class="step-hdr" onclick="toggleStep('${key}')">
          <div class="step-n">${isDone?'✓':si+1}</div>
          <div class="step-ttl">${tx(step.title)}</div>
          <span class="toggle-ico">▼</span>
        </div>
        <div class="step-body${isOpen?' open':''}" id="sb_${key}">
          <div class="sql-lbl">SQL — edit and run it</div>
          <textarea class="sql-editor" id="sql_${key}" rows="${(currentSql.match(/\n/g)||[]).length + 2}">${currentSql}</textarea>
          <div class="editor-actions">
            <button class="run-btn" id="rbtn_${key}" onclick="runStep('${key}','${si}')">
              ▶ Run Query
            </button>
            <button class="reset-btn" onclick="resetStep('${key}','${si}')">Reset SQL</button>
            <span class="row-count" id="rc_${key}"></span>
          </div>
          <div id="res_${key}"></div>
          <div class="explain-box${isDone?' show':''}" id="exp_${key}">${tx(step.explain)}</div>
        </div>
      </div>
    `;
  });

  document.getElementById('main').innerHTML = html;
}

// ─── STEP INTERACTIONS ───────────────────────────────────────────
function toggleStep(key) {
  stepOpen[key] = !stepOpen[key];
  const card = document.getElementById('sc_'+key);
  const body = document.getElementById('sb_'+key);
  if (!card || !body) return;
  card.classList.toggle('open', stepOpen[key]);
  body.classList.toggle('open', stepOpen[key]);
  card.querySelector('.toggle-ico').style.transform = stepOpen[key] ? 'rotate(180deg)' : '';
}

function resetStep(key, si) {
  const q = curQ;
  if (!q) return;
  const step = q.steps[parseInt(si)];
  stepSql[key] = step.sql;
  const ta = document.getElementById('sql_'+key);
  if (ta) ta.value = step.sql;
}

function runStep(key, si) {
  const ta = document.getElementById('sql_'+key);
  if (!ta) return;
  const sql = ta.value.trim();
  stepSql[key] = sql;

  const resDiv = document.getElementById('res_'+key);
  const rcSpan = document.getElementById('rc_'+key);
  const expDiv = document.getElementById('exp_'+key);
  const btn = document.getElementById('rbtn_'+key);

  if (btn) { btn.disabled = true; btn.textContent = '⏳ Running…'; }

  setTimeout(() => {
    const result = runQuery(sql);

    if (result.error) {
      resDiv.innerHTML = `<div class="err-box">Error: ${escHtml(result.error)}</div>`;
      if (rcSpan) rcSpan.textContent = '';
    } else if (result.message) {
      resDiv.innerHTML = `<div class="err-box" style="background:#0a1a0a;border-color:#1a4a1a;color:var(--ok)">${result.message}</div>`;
      if (rcSpan) rcSpan.textContent = '';
      stepRan[key] = true;
      markDone(key);
    } else {
      resDiv.innerHTML = buildTable(result.cols, result.rows);
      if (rcSpan) rcSpan.textContent = `${result.rows.length} row${result.rows.length!==1?'s':''}`;
      stepRan[key] = true;
      markDone(key);
    }

    if (expDiv) expDiv.classList.add('show');
    if (btn) { btn.disabled = false; btn.textContent = '▶ Run Query'; }
    updateProgress();
  }, 10);
}

function markDone(key) {
  const card = document.getElementById('sc_'+key);
  if (card) {
    card.classList.add('done');
    const n = card.querySelector('.step-n');
    if (n) n.textContent = '✓';
  }
}

function updateProgress() {
  if (!curQ) return;
  curQ.steps.forEach((_,i) => {
    const key = `${curQ.id}_${i}`;
    const seg = document.querySelector(`.prog .pseg:nth-child(${i+1})`);
    if (seg) seg.classList.toggle('done', !!stepRan[key]);
  });
}

function buildTable(cols, rows) {
  if (!cols || cols.length === 0) return '';
  let h = `<div class="result-wrap"><div class="result-lbl">Result</div><div class="tbl-scroll"><table class="rtbl"><thead><tr>`;
  cols.forEach(c => h += `<th>${escHtml(String(c))}</th>`);
  h += '</tr></thead><tbody>';
  const display = rows.slice(0, 50);
  display.forEach(row => {
    h += '<tr>';
    row.forEach(cell => {
      const v = cell === null ? '<span style="color:var(--faint)">NULL</span>' : escHtml(String(cell));
      h += `<td>${v}</td>`;
    });
    h += '</tr>';
  });
  if (rows.length > 50) h += `<tr><td colspan="${cols.length}" style="color:var(--faint);text-align:center">... and ${rows.length-50} more rows</td></tr>`;
  return h + '</tbody></table></div></div>';
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── BOOT ────────────────────────────────────────────────────────
renderSidebar();

initSqlJs().then(() => {
  setUniverse('zipeats');
});
</script>
